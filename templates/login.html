<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Справочник сотрудников</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-icon login-logo">С</div>
    <p class="eyebrow">АТРИГРУПП</p>
    <h1>Вход в систему</h1>
    <p class="login-subtitle">Введите логин и пароль для доступа к справочнику.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post" class="login-form">
      <label>Логин<input name="username" autocomplete="username" required placeholder="Введите логин"></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required placeholder="Введите пароль"></label>
      <button class="submit-button" type="submit">Войти</button>
    </form>
    <p class="login-foot">Доступ предоставляется администратором компании.</p>
  </main>
</body>
</html>
